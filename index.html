
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Авиакомпания Россия от DASH</title>
    <style>
        body {
            margin: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f4f4;
        }
        
        .header-top {
            background: white;
            text-align: center;
            padding: 8px;
            font-size: 13px;
            color: #666;
            border-bottom: 1px solid #eaeaea;
        }

        .header-main {
            background: white;
            display: flex;
            align-items: center;
            padding: 20px 40px;
            border-bottom: 1px solid #eaeaea;
        }
        
        .logo img {
            height: 45px;
            display: block;
        }

        .hero-section {
            display: flex;
            height: calc(100vh - 100px);
            min-height: 500px;
        }

        .hero-left {
            width: 30%;
            background-color: #b22222;
            padding: 40px;
        }

        .hero-right {
            width: 70%;
            background-color: #1c1c1e;
            display: flex;
            flex-direction: column;
            justify-content: center;
            padding: 80px;
            color: white;
            box-sizing: border-box;
        }

        h1 {
            font-size: 46px;
            font-weight: 500;
            margin-bottom: 30px;
            line-height: 1.2;
            max-width: 800px;
        }

        .action-btn {
            background-color: #b22222;
            color: white;
            text-decoration: none;
            padding: 14px 35px;
            border-radius: 30px;
            font-size: 16px;
            font-weight: bold;
            display: inline-block;
            transition: background-color 0.3s;
            text-transform: uppercase;
        }

        .action-btn:hover {
            background-color: #8b0000;
        }
    </style>
</head>
<body>

    <div class="header-top">
        Вниманию пассажиров, планирующих путешествие
    </div>
    
    <div class="header-main">
        <div class="logo">
            <img src="https://www.rossiya-airlines.ru/local/templates/rossiya_airlines/tpl/img/logo_top.svg" alt="Россия">
        </div>
    </div>

    <div class="hero-section">
        <div class="hero-left">
        </div>
        <div class="hero-right">
            <h1>ЗАЙДИТЕ В АВИАКОМПАНИЮ РОССИИ ОТ DASH</h1>
            
            <div>
                <a href="https://t.me/RossiyaAir_rbxl" class="action-btn" target="_blank">ПОДРОБНЕЕ ></a>
            </div>
        </div>
    </div>

</body>
</html>
